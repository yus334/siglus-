name: Build Android APK

# 推送到 main/master、打 v* 标签，或手动触发时构建 APK。
# 构建产物在 Actions 页面的 Artifacts 里下载：siglus-apk
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件（NDK / CMake / BuildTools / Platform 34）
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: 拉取 SDL2
        run: |
          set -e
          if [ ! -d thirdparty/SDL ]; then
            git clone --depth 1 -b release-2.30.x https://github.com/libsdl-org/SDL.git thirdparty/SDL
          fi

      - name: 拷贝 SDL Java 端
        run: |
          set -e
          mkdir -p android/app/src/main/java/org/libsdl/app
          cp thirdparty/SDL/android-project/app/src/main/java/org/libsdl/app/*.java \
             android/app/src/main/java/org/libsdl/app/

      - name: 拉取 stb（图像/字体/OGG 解码，可选）
        continue-on-error: true
        run: |
          if [ ! -d thirdparty/stb ]; then
            git clone --depth 1 https://github.com/nothings/stb thirdparty/stb
          fi

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # 直接安装到 PATH，不依赖 action 注入，避免 "gradle: command not found"
      - name: 安装 Gradle 8.2
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo ln -sf /opt/gradle-8.2/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: 构建 APK
        working-directory: android
        run: |
          set -e
          TYPE="${{ inputs.build_type }}"
          if [ -z "$TYPE" ] || [ "$TYPE" = "debug" ]; then
            gradle assembleDebug --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: siglus-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 打 v* 标签时把 APK 挂到 GitHub Release 上
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/*/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

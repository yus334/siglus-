buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// 注意：不要在这里写 allprojects { repositories { ... } }，
// 与 settings.gradle 的 repositoriesMode 冲突会直接让构建失败。
// 仓库统一由 settings.gradle 的 dependencyResolutionManagement 提供。

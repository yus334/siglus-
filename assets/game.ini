; Siglus 移植框架 —— 工程配置
; 所有路径相对于数据根目录（PC: --data 指定的目录；安卓: <filesDir>/game）

[game]
design_width   = 1280
design_height  = 720
script         = script/demo.asm
dialect        = asm          ; asm = 本文本方言（自测用）；ss = 真实 .ss 字节码
opcodes        = opcodes/ss_opcodes.csv
archive        = game         ; 目录型：填目录名；封包型：填 Scene.pkg
archive_type   = dir          ; dir | pkg
image_ext      = png,g00      ; 资源名不带扩展名时依次尝试
mask_image     = system/mask.png

[text]
font           = font/default.ttf
font_size      = 28
; .ttc 字体集合（msyh.ttc / YuGothM.ttc / meiryo.ttc）里选第几个字体，默认 0
face_index     = 0
chars_per_sec  = 40
box_x          = 80
box_y          = 520
box_w          = 1120
box_h          = 160

; BGM 循环点（单位：采样帧）。Siglus 的循环信息藏在游戏数据里，
; 用 siglus_probe 或现成工具提取后填在这里，否则循环处会有爆音。
[loop]
; bgm01_start  = 123456
; bgm01_length = 2345678

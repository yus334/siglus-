; .pkg 条目布局 —— 【必须用实机样本校准，下面是占位值】
;
; 校准步骤：
;   1) siglus_probe Scene.pkg --dump 256
;   2) siglus_probe Scene.pkg --pkg            ; 列出启发式候选
;   3) 逐个试候选，直到 --pkg-layout 输出的文件名是可读文件名
;   4) siglus_probe Scene.pkg --pkg-layout pkg_layout.ini --pkg-extract out

[pkg]
count_offset = 0        ; 条目数量字段的文件偏移
entry_base   = 4        ; 条目表起始偏移
entry_stride = 32       ; 每条多少字节
name_offset  = 0        ; 条目内文件名字段偏移
name_len     = 0        ; <=0 表示以 '\0' 结尾
offset_field = 16       ; 条目内数据偏移字段
size_field   = 20       ; 条目内数据长度字段
field_size   = 4        ; 偏移/长度字段宽度（4 或 8）
data_base    = 0        ; 数据区基址，最终 offset += data_base
count_adjust = 0        ; count 字段修正（某些包写成 count-1）
